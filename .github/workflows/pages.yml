name: Web-App veröffentlichen

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: App-Ordner finden
        id: dir
        run: |
          # Funktioniert, egal ob die Dateien im Ordner "site" oder direkt im Hauptordner liegen
          if [ -f site/index.html ]; then DIR=site; else DIR=.; fi
          echo "Gefunden: $DIR"
          ls -la "$DIR"
          if [ ! -f "$DIR/index.html" ]; then echo "index.html fehlt – bitte die Dateien aus dem Ordner 'site' hochladen"; exit 1; fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: PDF-Bibliothek und Schriften einbauen
        run: |
          DIR="${{ steps.dir.outputs.dir }}"
          curl -fsSL -o "$DIR/jspdf.umd.min.js" https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -fsSL -o "$DIR/pdf.min.js" https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js || echo "PDF-Leser fehlt"
          curl -fsSL -o "$DIR/pdf.worker.min.js" https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js || echo "PDF-Leser fehlt"
          mkdir -p "$DIR/fonts"
          for wgt in 400 500 600 700; do
            curl -fsSL -o "$DIR/fonts/instrument-sans-$wgt.woff2" https://cdn.jsdelivr.net/fontsource/fonts/instrument-sans@latest/latin-$wgt-normal.woff2 || echo "Schrift $wgt fehlt"
          done
          for wgt in 400 600; do
            curl -fsSL -o "$DIR/fonts/source-serif-4-$wgt.woff2" https://cdn.jsdelivr.net/fontsource/fonts/source-serif-4@latest/latin-$wgt-normal.woff2 || echo "Schrift $wgt fehlt"
          done
          # Versionsnummer für Updates (Offline-Speicher wird damit erneuert)
          sed -i "s/__BUILD__/${{ github.run_number }}/g" "$DIR/sw.js" "$DIR/web-bridge.js"
          # Nicht mit veröffentlichen
          rm -rf "$DIR/.github" "$DIR/build-web.py" "$DIR/ANLEITUNG.md" 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dir.outputs.dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
